<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>mcd-ordering 演示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0F0D0C; color:#E8E4DC; font-family:"Consolas","Microsoft YaHei",monospace; font-size:18px;
    width:1280px; height:720px; overflow:hidden; position:relative;
  }
  #bg { position:absolute; inset:0; background:
      radial-gradient(ellipse at 20% 0%, #1E1714 0%, transparent 60%),
      radial-gradient(ellipse at 90% 100%, #241A16 0%, transparent 55%), #0F0D0C; }
  .grain { position:absolute; inset:0; opacity:.025; background-image:
      repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px); }
  #term { position:absolute; left:52px; top:36px; right:52px; bottom:36px; }
  .row { white-space:pre-wrap; word-break:break-all; line-height:1.55; }
  .cmd  { color:#7FD1A0; font-size:19px; }
  .out  { color:#C9C2B6; font-size:19px; }
  .note { color:#9C9488; font-style:italic; font-size:17px; }
  .step { color:#FFBC0D; font-weight:700; margin-top:22px; font-size:21px; }
  .step:first-child { margin-top:0; }
  .banner { color:#FFBC0D; font-size:32px; font-weight:700; letter-spacing:.5px; margin-bottom:8px; }
  .banner2{ color:#FFBC0D; font-size:26px; font-weight:700; margin-bottom:8px; }
  .rule { color:#3A3330; }
  .cursor { display:inline-block; width:9px; height:17px; background:#FFBC0D;
            vertical-align:-3px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  #prog { position:absolute; left:0; bottom:0; height:3px; background:#FFBC0D; width:0; }
  #brand { position:absolute; right:56px; bottom:16px; font-size:12px; color:#4A423E; letter-spacing:1px; }
</style>
</head>
<body>
<div id="bg"></div><div class="grain"></div>
<div id="term"></div>
<div id="prog"></div>
<div id="brand">mcd-ordering</div>
<script>
const SEQ = [["banner", "mcd-ordering · 麦当劳一句话点餐 Skill"], ["note", "演示数据全部来自麦当劳 MCP 真实接口（2026-10-24 11:15 采集）"], ["pause", 700], ["title", "Step 0. 解析意图"], ["note", "用户输入：「3个人，不要辣，其中1人吃素，预算150」→ 抽取槽位：人数=3, 忌口=[不吃辣,吃素], 预算=150, 场景=外送"], ["cmd", "$ 用户：3个人，不要辣，其中1人吃素，预算150"], ["out", "  人数=3  忌口=[不吃辣, 吃素]  预算=150  场景=外送(默认)"], ["pause", 600], ["title", "Step 1. 定位门店"], ["note", "可送门店列表是动态的，每次会话都重新查询"], ["cmd", "$ python scripts/mcd_call.py delivery-query-stores '{...addressId..., beType:2}'"], ["out", "  1450056  145005602   麦当劳上海食品一店餐厅              06:30-23:00  营业中=True"], ["out", "  1450556  145055602   麦当劳上海黄浦区福州路上海书城餐厅        07:00-22:00  营业中=True"], ["out", "  1450441  145044102   麦当劳上海福州路餐厅               06:30-23:00  营业中=True"], ["note", "营业时间 + businessStatus 一并展示，让用户知道哪家开着"], ["title", "Step 2. 领券"], ["note", "券按周批次滚动，服务端会自动把过期券换成下一批"], ["cmd", "$ python scripts/mcd_call.py auto-bind-coupons '{}'"], ["out", "  [soft_fail] 暂无可领取的优惠券"], ["note", "499 是「没有新券可领」，不是错误 —— 脚本标记 soft_fail 避免误判"], ["cmd", "$ python scripts/mcd_call.py query-my-coupons '{}'   # 卡包"], ["out", "  11.9元麦辣鸡腿堡             2026-10-26 10:30:00 ~ 2026-10-30 23:59:59   未到使用时间"], ["out", "  19.9元王牌炸鸡任选2           2026-10-26 10:30:00 ~ 2026-10-30 23:59:59   未到使用时间"], ["cmd", "$ python scripts/mcd_call.py query-store-coupons '{...}'  # 该门店"], ["out", "  （当前时段该门店无可用券）"], ["note", "关键：卡包券 ≠ 门店可用券，判断能否用必须查门店券"], ["title", "Step 3. 拉菜单 + 判定人数"], ["note", "套餐名不可信，用 round 里饮料数量判定真实人数"], ["cmd", "$ python scripts/menu_helper.py candidates --menu menu.json --people 3 --details det/"], ["out", "  9900013002   畅享吃鸡三人餐                      86.0 元  供3人 人均28.7"], ["out", "  9900013004   合家欢聚鸡牛三人餐                    96.0 元  供3人 人均32.0"], ["out", "  9900012938   快乐吃鸡双人餐                      55.9 元  供2人 人均27.9"], ["out", "  9900012940   鸡牛堡堡双人餐                      64.9 元  供2人 人均32.5"], ["out", "  9900012999   大吉大利吃鸡双人餐                    73.9 元  供2人 人均37.0"], ["out", "  ▸ single  畅享吃鸡三人餐×1                                合计   86.0 元  人均 28.67"], ["note", "「快乐吃鸡双人餐」饮料数=2 → 真 2 人份；名称会骗人，round 不会"], ["title", "Step 4. 忌口检查"], ["note", "不静默降级 —— 满足不了必须显式告知"], ["cmd", "$ python scripts/menu_helper.py check --plan plan.json --restriction 不吃辣 吃素 过敏"], ["note", "吃素：麦当劳没有素食主餐，给出兜底方案而不是默默换个汉堡"], ["title", "Step 5. 优惠券择优"], ["note", "按净省最大选券，一次只用一张"], ["cmd", "$ python scripts/menu_helper.py coupons --menu menu.json --plan plan.json --coupons cards.json"], ["note", "周末领的券要到下周一才能用 —— 如实告知，不让用户以为今天有券"], ["title", "Step 6. 算价"], ["note", "金额单位是「分」，展示除以 100"], ["cmd", "$ python scripts/mcd_call.py calculate-price '{...items...}'"], ["out", "  productOriginalPrice : 86.00 元"], ["out", "  deliveryPrice        :  6.00 元"], ["out", "  packingPrice         :  2.50 元"], ["out", "  ─────────────────────────────────────"], ["out", "  应付                 : 94.50 元   (3 人份, 人均 31.50)"], ["pause", 500], ["title", "Step 7. 出方案，停下等确认"], ["note", "下单涉及真实支付，绝不自动越权"], ["out", "  【3 人份方案】麦当劳上海食品一店餐厅"], ["out", ""], ["out", "  商品                     数量   小计"], ["out", "  畅享吃鸡三人餐              1   86.0"], ["out", "  经典小食2件                1   19.9"], ["out", "  ─────────────────────────────────────"], ["out", "  商品小计                      105.9"], ["out", "  配送费                         6.0"], ["out", "  打包费                         2.5"], ["out", "  应付                          114.4 元    人均 38.1"], ["out", ""], ["out", "  忌口：⚠️ 部分满足"], ["out", "    · 不吃辣 —— 已全部换成不辣款"], ["out", "    · 1人吃素 —— ⚠️ 麦当劳无素食主餐，该位安排"], ["out", "                「单人餐 + 泷愿成真麦旋风(大米风味)」"], ["out", "                属甜品类，主食无法满足，建议另行准备"], ["out", ""], ["out", "  优惠券：本次不适用（卡包券需等到 10-26 才能用）"], ["out", ""], ["out", "  ⏸  已停下，等待用户说「下单」"], ["pause", 800], ["banner2", "技能能力：人数 · 忌口 · 搭配 · 优惠券 · 下单"], ["note", "外加一个随点随玩的 McDCraft 小游戏 —— 麦当劳×我的世界风体素跑酷"], ["pause", 900]];
const term = document.getElementById('term');
const prog = document.getElementById('prog');
let i = 0;

const SPEED = 1;           // 整体速度倍率
const TYPE_MS = 14;        // 每字符毫秒

function addRow(cls, text, instant){
  const d = document.createElement('div');
  d.className = 'row ' + cls;
  term.appendChild(d);
  if(instant){ d.textContent = text; return; }
  let n = 0;
  return new Promise(res => {
    const cur = document.createElement('span');
    cur.className = 'cursor';
    d.appendChild(cur);
    const tick = () => {
      if(n >= text.length){ if(cur.parentNode) cur.remove(); res(); return; }
      cur.insertAdjacentText('beforebegin', text[n++]);
      setTimeout(tick, TYPE_MS / SPEED);
    };
    tick();
  });
}

async function play(){
  await new Promise(r=>setTimeout(r,600));
  for(i=0;i<SEQ.length;i++){
    const [kind, val] = SEQ[i];
    if(kind==='pause'){ await new Promise(r=>setTimeout(r, val/SPEED)); continue; }
    if(kind==='banner'){ await addRow('banner', val, true); continue; }
    if(kind==='banner2'){ await addRow('banner2', val, true); continue; }
    if(kind==='title'){
      term.appendChild(document.createElement('div'));
      await addRow('rule', '─'.repeat(74), true);
      await addRow('step', val, true);
      continue;
    }
    if(kind==='cmd'){ await addRow('cmd', val, false); continue; }
    if(kind==='note'){ await addRow('note', val, true); continue; }
    if(kind==='out'){ await addRow('out', val, true); continue; }
  }
  await new Promise(r=>setTimeout(r,2500));
  document.title = 'DONE';
  window.__DEMO_DONE = true;
}

function tickProgress(){
  const p = (i/SEQ.length)*100;
  prog.style.width = p + '%';
  if(i < SEQ.length) setTimeout(tickProgress, 60);
}
tickProgress();
play();
</script>
</body>
</html>
